version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: scj-mysql
    restart: always
    environment:
      MYSQL_DATABASE: srichairman_db
      MYSQL_USER: scj_user
      MYSQL_PASSWORD: scj_password
      MYSQL_ROOT_PASSWORD: scj_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scj-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/srichairman_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: scj_user
      SPRING_DATASOURCE_PASSWORD: scj_password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
    depends_on:
      - mysql

volumes:
  mysql_data:
