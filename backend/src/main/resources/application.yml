server:
  port: 8080

spring:
  application:
    name: sri-chairman-jewellers-backend

  # Default datasource: In-memory H2 (Zero configuration needed, starts instantly)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:srichairman;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# CORS & Upload Settings
app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
